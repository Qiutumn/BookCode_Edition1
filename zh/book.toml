schema_version = 1

[book]
title = "Python 贝叶斯建模与计算：中文版"
language = "zh-CN"
source_license = "CC-BY-NC-SA-4.0"
code_license = "GPL-2.0"

# Static generation covers every canonical builder and never imports a builder
# from the live chapter directory. Execution profiles stay intentionally smaller
# until their optional stacks and full numerical runs are verified.
[profiles.static]
execute = false
timeout = 120
allow_errors = false
units = [
  "dedication", "foreword", "preface", "symbol-list",
  "chapter-1", "chapter-2", "chapter-3", "chapter-4", "chapter-5",
  "chapter-6", "chapter-7", "chapter-8", "chapter-9", "chapter-10",
  "chapter-11", "glossary", "references",
]
environment = "core"

[profiles.smoke]
execute = true
timeout = 300
allow_errors = false
units = [
  "dedication", "foreword", "symbol-list",
  "chapter-1", "chapter-2", "chapter-3", "chapter-4", "chapter-5",
  "chapter-6", "chapter-7", "chapter-8", "chapter-9", "chapter-10",
  "chapter-11", "glossary", "references",
]
environment = "pymc"

[profiles.release]
execute = true
timeout = 1200
allow_errors = false
units = [
  "dedication", "foreword", "symbol-list",
  "chapter-1", "chapter-2", "chapter-3", "chapter-4", "chapter-5",
  "chapter-6", "chapter-7", "chapter-8", "chapter-9", "chapter-10",
  "chapter-11", "glossary", "references",
]
environment = "pymc"

# A landing/welcome unit is reserved for a future generated index. It has no
# canonical builder yet and is therefore explicitly planned rather than silently
# omitted from the edition order.
[[units]]
id = "welcome"
order = 10
kind = "front"
title = "欢迎"
status = "planned"
required = false

[[units]]
id = "dedication"
order = 20
kind = "front"
title = "献词"
status = "available"
path = "FrontMatter/Dedication"
builder = "FrontMatter/Dedication/build.py"
notebook = "Dedication_zh.ipynb"
org = "Dedication_zh.org"
assets_dir = "generated"
environment = "core"
required = true

[[units]]
id = "foreword"
order = 30
kind = "front"
title = "序言"
status = "available"
