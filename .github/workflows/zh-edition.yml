name: Chinese edition

on:
  push:
    paths:
      - "zh/tools/**"
      - "zh/tests/**"
      - "zh/manifests/**"
      - "zh/book.toml"
      - "zh/requirements.txt"
      - "zh/environments/**"
      - ".github/workflows/zh-edition.yml"
  pull_request:
    paths:
      - "zh/**"
      - ".github/workflows/zh-edition.yml"
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Execute the smoke-verified chapter matrix"
        required: false
        type: boolean
        default: false
      run_release:
        description: "Execute the smoke-verified chapter release matrix without promotion"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: zh-edition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static validation (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zh/environments/core.lock.txt
      - name: Install static build tools
        run: python -m pip install -r zh/environments/core.lock.txt
      - name: Run shared infrastructure tests
        run: python -m unittest discover -s zh/tests -v
      - name: Validate book and unit schemas
        run: python zh/tools/build_book.py validate

  # Each matrix entry's `environment` is a space-separated list of the
  # zh/environments/*.lock.txt groups that unit's manifest declares (core is
  # always installed separately below). The Preface (optional-modeling/bambi,
  # still unresolved) is intentionally not in this matrix -- see
  # zh/environments/README.md for current status. Chapter 7's heaviest cell
  # (see system-dependencies.md) needs native PyTensor compilation to fit
  # comfortably in this profile's timeout; a header-less runner without it
  # may need a larger timeout override.
  smoke:
    name: Smoke ${{ matrix.unit }} (${{ matrix.environment }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: dedication
            environment: pymc
          - unit: foreword
            environment: pymc
          - unit: symbol-list
            environment: pymc
          - unit: chapter-1
            environment: pymc
          - unit: chapter-2
            environment: pymc
          - unit: chapter-3
            environment: pymc tfp
          - unit: chapter-4
            environment: pymc tfp
          - unit: chapter-5
            environment: pymc
          - unit: chapter-6
            environment: pymc tfp
          - unit: chapter-7
            environment: pymc bart
          - unit: chapter-8
            environment: pymc ml
          - unit: chapter-9
            environment: pymc
          - unit: chapter-10
            environment: pymc tfp ppl
          - unit: chapter-11
            environment: pymc tfp
          - unit: glossary
            environment: pymc
          - unit: references
            environment: pymc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            zh/environments/core.lock.txt
            zh/environments/*.lock.txt
      - name: Install execution stack
        run: |
          # PyTensor 2.38.x declares numba<=0.65.1, which has no Python 3.12
          # wheel below 0.59 and conflicts with numpy==2.5.2 on every 0.59-
          # 0.65.1 release -- a normal resolve of the full stack in one pass
          # walks that range down to a source-only build that fails outright
          # on 3.12. pymc similarly declares cachetools<7. Nothing in this
          # project uses PyTensor's numba backend (see
          # zh/environments/system-dependencies.md), so pytensor and pymc
          # are installed together with --no-deps (after numba/llvmlite
          # resolve normally) to skip re-checking those bounds; their own
          # actual runtime dependencies (everything except numba/llvmlite)
          # are pinned in pymc-extras.lock.txt and installed normally
          # alongside core.lock.txt/pymc.lock.txt/tfp.lock.txt. The optional
          # bart/ml/ppl groups each declare unrelated, hand-resolved
          # transitive versions (see their lock file headers), so each is
          # installed with its own separate --no-deps pass rather than
          # folded into the normal resolve, which would otherwise let their
          # solvers "fix" numpy/numba/llvmlite by silently downgrading them.
          python -m pip install numba==0.67.0 llvmlite==0.49.0
          python -m pip install --no-deps -r zh/environments/pytensor-pymc.lock.txt
          args="-r zh/environments/core.lock.txt -r zh/environments/pymc.lock.txt -r zh/environments/pymc-extras.lock.txt"
          nodeps_groups=""
          for group in ${{ matrix.environment }}; do
            case "$group" in
              pymc) ;;
              tfp) args="$args -r zh/environments/tfp.lock.txt" ;;
              bart|ml|ppl) nodeps_groups="$nodeps_groups $group" ;;
              *) echo "unknown environment group: $group" >&2; exit 1 ;;
            esac
          done
          python -m pip install $args
          for group in $nodeps_groups; do
            python -m pip install --no-deps -r "zh/environments/$group.lock.txt"
          done
          python -m pip check
      - name: Execute staged smoke build
        run: >-
          python zh/tools/build_book.py build
          --profile smoke
          --unit "${{ matrix.unit }}"
          --staging-dir "${{ runner.temp }}/zh-smoke-${{ matrix.unit }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zh-smoke-${{ matrix.unit }}
          path: ${{ runner.temp }}/zh-smoke-${{ matrix.unit }}
          if-no-files-found: ignore

  release-check:
    name: Release check ${{ matrix.unit }} (${{ matrix.environment }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release)
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: dedication
            environment: pymc
          - unit: foreword
            environment: pymc
          - unit: symbol-list
            environment: pymc
          - unit: chapter-1
            environment: pymc
          - unit: chapter-2
            environment: pymc
          - unit: chapter-3
            environment: pymc tfp
          - unit: chapter-4
            environment: pymc tfp
          - unit: chapter-5
            environment: pymc
          - unit: chapter-6
            environment: pymc tfp
          - unit: chapter-7
            environment: pymc bart
          - unit: chapter-8
            environment: pymc ml
          - unit: chapter-9
            environment: pymc
          - unit: chapter-10
            environment: pymc tfp ppl
          - unit: chapter-11
            environment: pymc tfp
          - unit: glossary
            environment: pymc
          - unit: references
            environment: pymc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            zh/environments/core.lock.txt
            zh/environments/*.lock.txt
      - name: Install release stack
        run: |
          # See the smoke job's "Install execution stack" step for why
          # pytensor/pymc are staged separately (--no-deps) from the rest
          # of the stack, and why bart/ml/ppl each get their own --no-deps
          # pass instead of being folded into the normal resolve.
          python -m pip install numba==0.67.0 llvmlite==0.49.0
          python -m pip install --no-deps -r zh/environments/pytensor-pymc.lock.txt
          args="-r zh/environments/core.lock.txt -r zh/environments/pymc.lock.txt -r zh/environments/pymc-extras.lock.txt"
          nodeps_groups=""
          for group in ${{ matrix.environment }}; do
            case "$group" in
              pymc) ;;
              tfp) args="$args -r zh/environments/tfp.lock.txt" ;;
              bart|ml|ppl) nodeps_groups="$nodeps_groups $group" ;;
              *) echo "unknown environment group: $group" >&2; exit 1 ;;
            esac
          done
          python -m pip install $args
          for group in $nodeps_groups; do
            python -m pip install --no-deps -r "zh/environments/$group.lock.txt"
          done
          python -m pip check
      - name: Execute staged release check
        run: >-
          python zh/tools/build_book.py release
          --unit "${{ matrix.unit }}"
          --staging-dir "${{ runner.temp }}/zh-release-${{ matrix.unit }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zh-release-${{ matrix.unit }}
          path: ${{ runner.temp }}/zh-release-${{ matrix.unit }}
          if-no-files-found: ignore

# This workflow never passes --promote, commits, pushes, or deploys generated files.
