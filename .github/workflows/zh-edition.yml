name: Chinese edition

on:
  push:
    paths:
      - "zh/tools/**"
      - "zh/tests/**"
      - "zh/manifests/**"
      - "zh/book.toml"
      - "zh/requirements.txt"
      - "zh/environments/**"
      - ".github/workflows/zh-edition.yml"
  pull_request:
    paths:
      - "zh/**"
      - ".github/workflows/zh-edition.yml"
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Execute the smoke-verified chapter matrix (1-3, 9)"
        required: false
        type: boolean
        default: false
      run_release:
        description: "Execute the smoke-verified chapter release matrix (1-3, 9) without promotion"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: zh-edition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static validation (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zh/environments/core.lock.txt
      - name: Install static build tools
        run: python -m pip install -r zh/environments/core.lock.txt
      - name: Run shared infrastructure tests
        run: python -m unittest discover -s zh/tests -v
      - name: Validate book and unit schemas
        run: python zh/tools/build_book.py validate

  smoke:
    name: Smoke ${{ matrix.unit }} (${{ matrix.environment }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: chapter-1
            environment: pymc
          - unit: chapter-2
            environment: pymc
          - unit: chapter-3
            environment: pymc
          - unit: chapter-9
            environment: pymc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            zh/environments/core.lock.txt
            zh/environments/${{ matrix.environment }}.lock.txt
      - name: Install execution stack
        run: |
          python -m pip install -r zh/environments/core.lock.txt
          python -m pip install -r "zh/environments/${{ matrix.environment }}.lock.txt"
          python -m pip check
      - name: Execute staged smoke build
        run: >-
          python zh/tools/build_book.py build
          --profile smoke
          --unit "${{ matrix.unit }}"
          --staging-dir "${{ runner.temp }}/zh-smoke-${{ matrix.unit }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zh-smoke-${{ matrix.unit }}
          path: ${{ runner.temp }}/zh-smoke-${{ matrix.unit }}
          if-no-files-found: ignore

  release-check:
    name: Release check ${{ matrix.unit }} (${{ matrix.environment }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release)
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: chapter-1
            environment: pymc
          - unit: chapter-2
            environment: pymc
          - unit: chapter-3
            environment: pymc
          - unit: chapter-9
            environment: pymc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            zh/environments/core.lock.txt
            zh/environments/${{ matrix.environment }}.lock.txt
      - name: Install release stack
        run: |
          python -m pip install -r zh/environments/core.lock.txt
          python -m pip install -r "zh/environments/${{ matrix.environment }}.lock.txt"
          python -m pip check
      - name: Execute staged release check
        run: >-
          python zh/tools/build_book.py release
          --unit "${{ matrix.unit }}"
          --staging-dir "${{ runner.temp }}/zh-release-${{ matrix.unit }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zh-release-${{ matrix.unit }}
          path: ${{ runner.temp }}/zh-release-${{ matrix.unit }}
          if-no-files-found: ignore

# This workflow never passes --promote, commits, pushes, or deploys generated files.
